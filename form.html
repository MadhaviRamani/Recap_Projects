  <body>
    <a href="./index.html"></a>
    <!-- ================= HEADER ================= -->
    <header class="fixed-top shadow-sm">
      <nav class="navbar quiz-navbar">
        <div class="container justify-content-center">
          <div class="d-flex align-items-center">
            <img src="./image/brain.png" alt="Quiz Icon" class="quiz-icon" />

            <h1 class="h3 mb-0 quiz-title">Quiz App</h1>
          </div>
        </div>
      </nav>
    </header>

    <!-- ================= MAIN ================= -->
    <main class="container-fluid quiz-main">
      <section>
        <div class="container mt-5">
          <div class="row justify-content-center">
            <!--   ============ Form =============== -->
            <div class="col-md-6" data-js="form-container">
              <h2 class="mb-4">Submit Your Question</h2>
              <form id="question-form">
                <div class="mb-3">
                  <label for="your-question" class="form-label"
                    >Your Question:</label
                  >
                  <textarea
                    type="text"
                    data-js="question-input"
                    class="form-control"
                    id="your-question"
                    required
                    minlength="5"
                  > </textarea>
          
                </div>
                <div class="mb-3">
                  <label for="your-answer" class="form-label" 
                    >Your Answer:</label
                  >
                  <textarea
                    type="text"
                    data-js="answer-input"
                    class="form-control"
                    id="your-answer"
                    required
                    minlength="1"
                  > </textarea>
                  
                </div>
                <div class="mb-3">
                  <label for="your-tag" class="form-label">Your Tag:</label>
                  <input
                    type="text"
                    data-js="tag-input"
                    class="form-control"
                    id="your-tag"
                    required
                    minlength="1"
                  >
                </div>

                <button
                  type="submit"
                  class="btn-primary"
                  value="Submit"
                  data-js="submit-button"
                >
                  Submit
                </button>
              </form>

              <!-- ============== SUBMITTED QUESTION ============= -->
              <div class="col-12" id="submitted-question-container" data-js="question-container">

      <div class="container">
        <div class="d-flex justify-content-around">
