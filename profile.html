<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Quiz App - Profile</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- custom JS -->
    <script src="./js/profile.js" defer></script>
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body data-js="body-mode">
    <!-- Header -->
    <a href="./profile.html"></a>
    <!-- ================= HEADER ================= -->

    <header class="fixed-top shadow-sm">
      <nav class="navbar quiz-navbar">
        <div class="container justify-content-center">
          <div class="d-flex align-items-center">
            <img src="./image/brain.png" alt="Quiz Icon" class="quiz-icon" />

            <h1 class="h3 mb-0 quiz-title">Quiz App</h1>
          </div>
        </div>
      </nav>
    </header>
    <!-- Main -->
    <main class="container-fluid quiz-main profile-page">
      <section class="profile-section question-card">
        <div class="container-fluid">
          <!-- Profile -->
          <div class="profile-user">
            <div>
              <i class="bi">
                <img
                  src="./image/woman.png"
                  alt="womanphoto"
                  class="rounded-circle"
                />
              </i>
            </div>

            <h2 class="profile-name">Madhavi Ramani</h2>
          </div>

          <!-- About Me -->
          <div class="about-section">
            <h3>About me</h3>

            <p>
              I enjoy learning new things and testing my knowledge through
              quizzes.
            </p>
          </div>
        </div>
        <!-- Statistics -->
        <div class="profile-stats">
          <div class="profile-stat">
            <i class="bi bi-question-circle-fill"></i>
            <span>10</span>
          </div>

          <div class="profile-stat">
            <i class="bi bi-bookmark-fill"></i>
            <span>3</span>
          </div>
        </div>

        <!-- Settings -->
        <div class="settings-section">
          <h3>
            <img
              src="./image/settings.png"
              alt="setting"
              class="setting-img"
            />Settings
          </h3>

          <div class="dark-mode-row">
            <span>Dark Mode</span>

            <label class="dark-toggle">
              <input type="checkbox" data-js="toggle-button" />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="fixed-bottom quiz-footer shadow-lg">
      <div class="container">
        <div class="d-flex justify-content-around">
          <a href="./index.html" class="footer-icon">
            <i class="bi bi-house-fill"></i>
          </a>

          <a href="./bookmark.html" class="footer-icon">
            <i class="bi bi-bookmark-fill"></i>
          </a>
          <a href="./form.html" class="footer-icon">
            <i class="bi bi-plus-circle-fill"></i>
          </a>
          <a href="./profile.html" class="footer-icon">
            <i class="bi bi-person-fill"></i>
          </a>
        </div>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
